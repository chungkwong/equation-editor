<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
        <title>Web 画布</title>
        <script type="text/javascript" src="drawing-pad.js"></script>
        <script type='text/javascript'>
            window.addEventListener('load', function () {
                var colorList=['black'];
                var canvas = createDrawingPad(document.getElementById('drawing-pad'),colorList);
                canvas.width=window.innerWidth;
                canvas.height=window.innerHeight;
                document.getElementById('clear').onclick=canvas.clearTraceList;
                document.getElementById('undo').onclick=canvas.removeLastTrace;
                window.addEventListener('resize',function(){
                    canvas.width=window.innerWidth;
                    canvas.height=window.innerHeight;
                });
            },false); // end window.onLoad
        </script>
        <style>
            body{
                padding: 0;
                margin: 0;
            }
            #toolbar{
                font-size: 200%;
                bottom: 0;
                position: absolute;
            }
            #drawing-pad{
                width:100%;
                height: 100%;
                padding: 0;
                margin: 0;
                border: none;
                /* height:50vh; */
            }
            #drawing-pad canvas{
                padding: 0;
                margin: 0;
                border: none;
            }
            button{
                font-size: 75%;
                padding: 0;
            }
            .black{
                color: black;
            }
            .red{
                color: red;
            }
            .green{
                color: green;
            }
            .blue{
                color: blue;
            }
        </style>
    </head>
    <body>
        <!-- <div id='equation-editor'></div> -->
        <div id='drawing-pad'></div>
        <div id='toolbar'>
            <button id='clear'>重写</button>
            <button id='undo'>撤销</button>
        </div>
    </body>
</html>
